<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="dsun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd08a" stop-opacity="0.95"/>
      <stop offset="42%" stop-color="#ff8a3d" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ff7a2f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dscarf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffb15c" stop-opacity="0.92"/>
      <stop offset="55%" stop-color="#ff7a2f" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#c93b12" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="dbody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b1a10" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#0d0b0a" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="dsoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <!-- warm chakra haze -->
  <ellipse cx="410" cy="175" rx="240" ry="200" fill="url(#dsun)" opacity="0.85"/>
  <circle cx="410" cy="168" r="132" fill="none" stroke="#ffc176" stroke-opacity="0.22" stroke-width="2"/>
  <circle cx="410" cy="168" r="158" fill="none" stroke="#ff7a2f" stroke-opacity="0.16" stroke-width="1.5" stroke-dasharray="4 12">
    <animateTransform attributeName="transform" type="rotate" from="0 410 168" to="360 410 168" dur="60s" repeatCount="indefinite"/>
  </circle>

  <!-- oversized brush kanji strokes -->
  <g fill="none" stroke="#ffd39a" stroke-opacity="0.14" stroke-linecap="round">
    <path d="M52 74 Q 148 40 236 76" stroke-width="15"/>
    <path d="M62 126 Q 160 96 250 132" stroke-width="11"/>
    <path d="M40 210 Q 120 160 214 196" stroke-width="18"/>
    <path d="M74 300 Q 168 246 268 286" stroke-width="13"/>
  </g>

  <!-- hidden leaf swirl -->
  <g fill="none" stroke="#ffb56b" stroke-opacity="0.36" stroke-width="5" stroke-linecap="round">
    <path d="M120 352 C 88 340 78 304 104 284 C 128 266 158 284 150 308 C 144 326 118 326 114 308"/>
    <path d="M114 308 L 132 300"/>
  </g>

  <!-- shinobi silhouette -->
  <g transform="translate(300 78)">
    <!-- halo behind head -->
    <circle cx="120" cy="86" r="86" fill="#ff7a2f" opacity="0.16" filter="url(#dsoft)"/>

    <!-- shoulders / cloak -->
    <path d="M22 300 C 34 222 74 182 120 182 C 168 182 208 224 220 300 Z" fill="url(#dbody)" stroke="#ff9a4d" stroke-opacity="0.34" stroke-width="2"/>

    <!-- spiky hair -->
    <path d="M62 96 L 44 48 L 78 70 L 82 28 L 110 62 L 132 20 L 146 64 L 178 38 L 166 84 L 192 96 L 170 122 L 70 122 Z"
          fill="#1a1009" stroke="#ff9a4d" stroke-opacity="0.42" stroke-width="2"/>

    <!-- face -->
    <path d="M72 92 C 72 66 94 50 120 50 C 146 50 168 66 168 92 L 164 126 C 158 150 140 164 120 164 C 100 164 82 150 76 126 Z"
          fill="#332119" stroke="#ffb873" stroke-opacity="0.5" stroke-width="2"/>

    <!-- headband plate + leaf mark -->
    <path d="M64 92 Q 120 66 176 92 L 174 110 Q 120 88 66 110 Z" fill="#263b46" stroke="#9fd0e6" stroke-opacity="0.55" stroke-width="2"/>
    <path d="M108 96 C 100 90 104 82 112 84 C 120 86 118 96 110 96 M112 96 L 122 90"
          fill="none" stroke="#ffd9a8" stroke-opacity="0.85" stroke-width="2.4" stroke-linecap="round"/>

    <!-- headband tails -->
    <path d="M176 96 C 214 78 240 92 268 70 L 254 106 C 228 122 204 112 174 118 Z" fill="url(#dscarf)" opacity="0.8"/>
    <path d="M176 108 C 212 112 236 132 266 130 L 250 152 C 220 150 198 132 172 128 Z" fill="url(#dscarf)" opacity="0.55"/>

    <!-- eyes -->
    <path d="M92 128 L 110 132 M132 132 L 150 128" stroke="#ffe0b0" stroke-opacity="0.85" stroke-width="4" stroke-linecap="round"/>

    <!-- flowing scarf -->
    <path d="M42 182 C 6 196 -14 230 -34 268 C -8 252 16 246 44 246 C 24 264 8 292 0 320 C 34 288 68 268 96 256 Z"
          fill="url(#dscarf)" opacity="0.78"/>
  </g>

  <!-- animated embers -->
  <g fill="#ffd6a0">
    <circle cx="96" cy="118" r="3.2" opacity="0.8">
      <animate attributeName="opacity" values="0.15;0.9;0.15" dur="3.4s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; 12 -22; 0 0" dur="5.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="540" cy="296" r="4" opacity="0.6">
      <animate attributeName="opacity" values="0.1;0.8;0.1" dur="4.1s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; -18 -26; 0 0" dur="6.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="250" cy="366" r="2.6" opacity="0.7">
      <animate attributeName="opacity" values="0.2;0.85;0.2" dur="2.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="516" cy="86" r="2.4" opacity="0.65">
      <animate attributeName="opacity" values="0.1;0.7;0.1" dur="3.8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
