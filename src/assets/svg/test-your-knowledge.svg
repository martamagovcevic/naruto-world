<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="kmoon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9fdcff" stop-opacity="0.7"/>
      <stop offset="45%" stop-color="#2fa3ff" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#2fa3ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="kscroll" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e6d9b8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#b7a27a" stop-opacity="0.72"/>
    </linearGradient>
    <linearGradient id="ksteel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d8ecf7" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#5b8ba4" stop-opacity="0.7"/>
    </linearGradient>
    <filter id="ksoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- exam blueprint grid -->
  <g stroke="#8fc9e8" stroke-opacity="0.1" stroke-width="1">
    <path d="M0 70 H600 M0 140 H600 M0 210 H600 M0 280 H600 M0 350 H600"/>
    <path d="M80 0 V420 M160 0 V420 M240 0 V420 M320 0 V420 M400 0 V420 M480 0 V420 M560 0 V420"/>
  </g>

  <!-- cool lantern glow -->
  <ellipse cx="420" cy="150" rx="220" ry="190" fill="url(#kmoon)" opacity="0.85"/>
  <circle cx="420" cy="142" r="104" fill="none" stroke="#9fdcff" stroke-opacity="0.26" stroke-width="2"/>
  <circle cx="420" cy="142" r="140" fill="none" stroke="#2fa3ff" stroke-opacity="0.2" stroke-width="1.4" stroke-dasharray="3 11">
    <animateTransform attributeName="transform" type="rotate" from="360 420 142" to="0 420 142" dur="72s" repeatCount="indefinite"/>
  </circle>

  <!-- floating kunai -->
  <g transform="translate(108 92) rotate(-24)" opacity="0.72">
    <path d="M0 -42 L9 -10 L9 22 L0 34 L-9 22 L-9 -10 Z" fill="url(#ksteel)" stroke="#dcf1ff" stroke-opacity="0.65" stroke-width="1.5"/>
    <path d="M-26 22 L26 22 M0 34 L0 60" stroke="#bcd9e8" stroke-width="4" stroke-linecap="round"/>
    <circle cx="0" cy="6" r="3" fill="#0d1b24"/>
    <animateTransform attributeName="transform" type="translate" values="0 0; 8 -14; 0 0" dur="7s" repeatCount="indefinite" additive="sum"/>
  </g>
  <g transform="translate(520 290) rotate(38)" opacity="0.55">
    <path d="M0 -34 L8 -8 L8 18 L0 28 L-8 18 L-8 -8 Z" fill="url(#ksteel)"/>
    <path d="M-20 18 L20 18 M0 28 L0 50" stroke="#bcd9e8" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- shuriken -->
  <g transform="translate(520 82) rotate(18)" opacity="0.6">
    <path d="M0 -34 L9 -9 L34 0 L9 9 L0 34 L-9 9 L-34 0 L-9 -9 Z" fill="url(#ksteel)" stroke="#dcf1ff" stroke-opacity="0.6"/>
    <circle cx="0" cy="0" r="6" fill="#0d1b24"/>
    <animateTransform attributeName="transform" type="rotate" from="18 520 82" to="378 520 82" dur="18s" repeatCount="indefinite"/>
  </g>

  <!-- exam scroll -->
  <g transform="translate(238 96)">
    <rect x="0" y="22" width="230" height="252" rx="8" fill="#7fa9bd" opacity="0.18" filter="url(#ksoft)"/>
    <path d="M18 34 Q 115 12 212 34 L 212 262 Q 115 284 18 262 Z" fill="url(#kscroll)" stroke="#f1e5c8" stroke-opacity="0.55" stroke-width="2"/>
    <rect x="4" y="20" width="26" height="258" rx="13" fill="#8c6f4a" stroke="#e0c9a0" stroke-opacity="0.6" stroke-width="2"/>
    <rect x="200" y="20" width="26" height="258" rx="13" fill="#8c6f4a" stroke="#e0c9a0" stroke-opacity="0.6" stroke-width="2"/>

    <!-- written exam lines -->
    <g stroke="#5c4a34" stroke-opacity="0.5" stroke-width="4" stroke-linecap="round">
      <path d="M46 76 H182"/>
      <path d="M46 104 H158"/>
      <path d="M46 132 H178"/>
      <path d="M46 160 H140"/>
      <path d="M46 188 H170"/>
    </g>

    <!-- seal stamp -->
    <circle cx="166" cy="224" r="22" fill="none" stroke="#b8412f" stroke-opacity="0.8" stroke-width="4"/>
    <path d="M154 224 H178 M166 212 V236" stroke="#b8412f" stroke-opacity="0.75" stroke-width="3"/>
  </g>

  <!-- drifting chakra motes -->
  <g fill="#bfe6ff">
    <circle cx="78" cy="330" r="3.5" opacity="0.7">
      <animate attributeName="opacity" values="0.15;0.85;0.15" dur="4.6s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; 14 -20; 0 0" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="54" r="2.8" opacity="0.6">
      <animate attributeName="opacity" values="0.1;0.75;0.1" dur="3.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="382" r="2.4" opacity="0.55">
      <animate attributeName="opacity" values="0.1;0.7;0.1" dur="5.3s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
